[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-voice-agent"
version = "0.1.0"
description = "PRISM: Voice-Native Interruptible Real-Time Agent Architecture — Samsung PRISM GenAI Hackathon 3.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["prism/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*", "agent*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

