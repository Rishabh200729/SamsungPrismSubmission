scenario:
  name: interrupted_tool_call
  description: >
    User asks agent to book a flight. Agent starts background work.
    At T=450ms user interrupts. Generation advances.
    Old tool result arrives at T=700ms and must be discarded as STALE.
    New task starts at T=720ms for the new request.
  tags: [interruption, stale_result, core]
  max_duration_ms: 2000

  sessions:
    default: {}

  events:
    - at_ms: 0
      type: TEXT_CHUNK
      payload:
        text: "Book a flight from Seoul to Tokyo"

    - at_ms: 10
      type: END_OF_TURN
      payload:
        final_text: "Book a flight from Seoul to Tokyo"

    - at_ms: 450
      type: INTERRUPTION
      payload:
        reason: user_interruption
        text: "Actually, change the destination to Osaka"

    - at_ms: 460
      type: TEXT_CHUNK
      payload:
        text: "Actually, change the destination to Osaka"

    - at_ms: 470
      type: END_OF_TURN
      payload:
        final_text: "Actually, change the destination to Osaka"

  trace_assertions:
    - entry_type: INTERRUPTION
      min_count: 1
      description: "INTERRUPTION was recorded"

    - entry_type: GENERATION_INVALIDATED
      min_count: 1
      description: "Generation was invalidated on interruption"

    - entry_type: SESSION_CREATED
      min_count: 1
      description: "Session was created"
