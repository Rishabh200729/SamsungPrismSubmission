scenario:
  name: stale_result_rejection
  description: >
    Tests that a TOOL_RESULT arriving after an interruption is
    explicitly marked STALE_RESULT_DISCARDED and never published
    as a valid action. The tool_result references a task from
    old generation 1 while current generation is 2.
  tags: [stale_result, cancellation, core]
  max_duration_ms: 1500

  sessions:
    default: {}

  events:
    - at_ms: 0
      type: TEXT_CHUNK
      payload:
        text: "Search for hotels in Busan"

    - at_ms: 10
      type: END_OF_TURN
      payload:
        final_text: "Search for hotels in Busan"

    # User interrupts before the tool result arrives
    - at_ms: 300
      type: INTERRUPTION
      payload:
        reason: user_interruption
        text: "Never mind, search in Jeju instead"

    # Stale tool result arrives after interruption
    # In a real scenario the task_id and call_id would be set
    # by the handler when it submits the TOOL_CALL; here we use
    # placeholder values to test the protocol path.
    - at_ms: 700
      type: TOOL_RESULT
      call_id: "stale-call-001"
      task_id: "stale-task-001"
      payload:
        call_id: "stale-call-001"
        task_id: "stale-task-001"
        result:
          hotels: ["Hotel A", "Hotel B"]
        success: true

  trace_assertions:
    - entry_type: INTERRUPTION
      min_count: 1
      description: "INTERRUPTION was recorded"

    - entry_type: GENERATION_INVALIDATED
      min_count: 1
      description: "Generation was invalidated"

    - entry_type: TOOL_RESULT
      min_count: 1
      description: "TOOL_RESULT event was recorded in trace"
